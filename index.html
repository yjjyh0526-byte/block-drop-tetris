<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0c13">
  <title>BLOCK DROP — Tetris</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#0a0c13;--panel:#111522;--line:#242a3a;--muted:#788096;--white:#f4f5fb;--lime:#c5f36b;--cyan:#6be5dc}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 42%,#151a29 0%,#0a0c13 68%);color:var(--white);font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
    .app{width:min(100%,920px)}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;grid-template-columns:repeat(2,8px);gap:3px;transform:rotate(-8deg)}.mark i{height:8px;background:var(--lime);border-radius:2px}.mark i:nth-child(2){opacity:.55}.mark i:nth-child(3){opacity:.72}.brand-name{font-weight:700;letter-spacing:.16em;font-size:13px}.brand-name span{color:var(--lime)}.tag{font:10px 'DM Mono',monospace;color:var(--muted);letter-spacing:.12em;border:1px solid var(--line);padding:7px 10px;border-radius:4px}
    .layout{display:grid;grid-template-columns:190px 300px 190px;justify-content:center;gap:18px;align-items:start}.side{display:flex;flex-direction:column;gap:14px}.card{background:linear-gradient(145deg,#131827,#10131e);border:1px solid var(--line);border-radius:8px;padding:16px}.label{font:10px 'DM Mono',monospace;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}.score{font-size:32px;font-weight:600;letter-spacing:.03em;margin-top:8px;font-variant-numeric:tabular-nums}.statrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px}.statrow b{font:18px 'DM Mono',monospace;font-weight:500}.statrow span{font:10px 'DM Mono',monospace;color:var(--muted);letter-spacing:.1em}.board-wrap{position:relative;padding:8px;background:#080a10;border:1px solid #343a4b;border-radius:8px;box-shadow:0 22px 70px #0008,0 0 50px #9ed6580a}.board-head{display:flex;justify-content:space-between;padding:0 4px 8px;font:9px 'DM Mono',monospace;color:#778096;letter-spacing:.13em}.board-head span:last-child{color:var(--lime)}canvas{display:block;width:284px;height:568px;background:#0b0e17;border-radius:3px}.overlay{position:absolute;z-index:2;inset:32px 8px 8px;background:#080a10c9;display:flex;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(3px);border-radius:3px;pointer-events:auto}.overlay.hidden{display:none}.modal h1{font-size:28px;letter-spacing:.04em;margin:0 0 8px}.modal p{font-size:12px;color:#9ca3b4;margin:0 0 22px}.btn{position:relative;z-index:3;border:0;background:var(--lime);color:#10140c;border-radius:4px;padding:12px 20px;font:700 11px 'Space Grotesk';letter-spacing:.14em;cursor:pointer;touch-action:manipulation;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.nextbox{display:grid;place-items:center;margin-top:10px;height:96px;background:#0b0e17;border:1px solid #202638;border-radius:5px}.nextbox canvas{width:128px;height:88px;background:transparent}.mini{font:10px 'DM Mono',monospace;color:#9299aa;line-height:1.9;margin-top:12px}.keys{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.key{font:9px 'DM Mono',monospace;color:#b3b9c8;background:#0b0e17;border:1px solid #252b3b;border-radius:4px;padding:7px;text-align:center}.key strong{color:var(--lime);font-weight:500}.hint{font-size:11px;color:#7c8498;line-height:1.6}.footer{margin:20px auto 0;text-align:center;font:9px 'DM Mono',monospace;color:#596174;letter-spacing:.12em}.mobile-controls{display:none}
    @media(max-width:760px){body{padding:16px 12px;align-items:flex-start}.topbar{margin-bottom:14px}.layout{grid-template-columns:minmax(0,300px) 110px;gap:10px}.board-wrap{grid-row:1;grid-column:1}.side.left{grid-column:2;grid-row:1}.side.right{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:12px}.score{font-size:25px}.stats .statrow{margin-top:10px}.nextbox{height:86px}.nextbox canvas{width:100px}.side.left .card:nth-child(2){display:none}canvas#board{width:min( min(65vw,284px), calc((100svh - 190px)*.5));height:auto;aspect-ratio:1/2}.board-wrap{padding:6px}.overlay{inset:30px 6px 6px}.keyhelp{display:none}.mobile-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px auto 0;max-width:300px}.mobile-controls button{height:42px;background:#151a28;border:1px solid #30374a;color:var(--white);border-radius:5px;font-size:17px;touch-action:none}.mobile-controls button:active{background:#2a3444;color:var(--lime)}.footer{margin-top:12px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><div class="mark"><i></i><i></i><i></i><i></i></div><div class="brand-name">BLOCK <span>DROP</span></div></div><div class="tag">CLASSIC / 001</div></header>
  <section class="layout">
    <aside class="side left">
      <div class="card"><div class="label">점수 / SCORE</div><div class="score" id="score">000000</div><div class="statrow"><span>최고 점수</span><b id="best">000000</b></div></div>
      <div class="card stats"><div class="statrow"><span>레벨</span><b id="level">01</b></div><div class="statrow"><span>라인</span><b id="lines">00</b></div></div>
      <div class="card keyhelp"><div class="label">조작 방법</div><div class="keys"><div class="key"><strong>← →</strong> 이동</div><div class="key"><strong>↑</strong> 회전</div><div class="key"><strong>↓</strong> 내리기</div><div class="key"><strong>SPACE</strong> 드롭</div><div class="key"><strong>P</strong> 일시정지</div><div class="key"><strong>R</strong> 다시시작</div></div></div>
    </aside>
    <div class="board-wrap"><div class="board-head"><span>PLAYFIELD</span><span>10 × 20</span></div><canvas id="board" width="284" height="568" aria-label="테트리스 게임 보드"></canvas><div class="overlay" id="overlay"><div class="modal"><h1 id="overlay-title">READY?</h1><p id="overlay-copy">블록을 쌓고, 라인을 지워보세요.</p><button class="btn" id="start" type="button">게임 시작</button></div></div></div>
    <aside class="side right">
      <div class="card"><div class="label">다음 블록 / NEXT</div><div class="nextbox"><canvas id="next" width="128" height="88"></canvas></div></div>
      <div class="card"><div class="label">TIP</div><p class="hint">한 줄을 채우면 라인이 사라지고 점수가 올라갑니다. 여러 줄을 한 번에 지워보세요.</p></div>
    </aside>
  </section>
  <div class="mobile-controls"><button data-action="left" aria-label="왼쪽">←</button><button data-action="rotate" aria-label="회전">↻</button><button data-action="down" aria-label="아래">↓</button><button data-action="right" aria-label="오른쪽">→</button><button data-action="drop" aria-label="바로 떨어뜨리기">⇊</button></div>
  <footer class="footer">A LITTLE FOCUS. A LOT OF BLOCKS.</footer>
</main>
<script>
(() => {
  const COLS=10, ROWS=20, SIZE=28;
  const COLORS={I:'#61ddd6',J:'#7589f5',L:'#f5a85c',O:'#f4d45e',S:'#9bde67',T:'#bd83ef',Z:'#f07882'};
  const SHAPES={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]};
  const boardCanvas=document.querySelector('#board'), ctx=boardCanvas.getContext('2d'), nextCanvas=document.querySelector('#next'), nctx=nextCanvas.getContext('2d');
  const overlay=document.querySelector('#overlay'), scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),levelEl=document.querySelector('#level'),linesEl=document.querySelector('#lines');
  let grid, piece, next, score=0, lines=0, level=1, best=Number(localStorage.getItem('blockdrop-best')||0), running=false, paused=false, gameOver=false, last=0, dropCounter=0, raf=0;
  bestEl.textContent=fmt(best);
  function fmt(n){return String(n).padStart(6,'0')}
  function randomPiece(){const types=Object.keys(SHAPES),type=types[Math.floor(Math.random()*types.length)];return {type,matrix:SHAPES[type].map(r=>r.slice()),x:0,y:0}}
  function spawn(){piece=next||randomPiece();next=randomPiece();piece.x=Math.floor((COLS-piece.matrix[0].length)/2);piece.y=0;drawNext();if(collides(piece,0,0)){endGame()}}
  function reset(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));score=0;lines=0;level=1;gameOver=false;paused=false;running=true;next=randomPiece();spawn();updateStats();overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
  function collides(p,dx,dy,m=p.matrix){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){const nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&grid[ny][nx]))return true}return false}
  function rotate(m){return m[0].map((_,i)=>m.map(row=>row[i]).reverse())}
  function move(dx){if(running&&!paused&&!collides(piece,dx,0))piece.x+=dx}
  function turn(){if(!running||paused)return;const m=rotate(piece.matrix),kicks=[0,-1,1,-2,2];for(const k of kicks)if(!collides(piece,k,0,m)){piece.x+=k;piece.matrix=m;return}}
  function softDrop(){if(!running||paused)return;if(!collides(piece,0,1)){piece.y++;score++}else lock();dropCounter=0;updateStats()}
  function hardDrop(){if(!running||paused)return;let d=0;while(!collides(piece,0,1)){piece.y++;d++}score+=d*2;lock();updateStats()}
  function lock(){piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type}));let cleared=0;grid=grid.filter(row=>{if(row.every(Boolean)){cleared++;return false}return true});while(grid.length<ROWS)grid.unshift(Array(COLS).fill(null));if(cleared){const pts=[0,100,300,500,800][cleared]||800;score+=pts*level;lines+=cleared;level=Math.floor(lines/10)+1}spawn();updateStats()}
  function updateStats(){scoreEl.textContent=fmt(score);linesEl.textContent=String(lines).padStart(2,'0');levelEl.textContent=String(level).padStart(2,'0');if(score>best){best=score;bestEl.textContent=fmt(best);localStorage.setItem('blockdrop-best',best)}}
  function drawCell(c,x,y,size=SIZE,alpha=1){c.globalAlpha=alpha;c.fillStyle=COLORS[x.type]||x;c.fillRect(y*size+1,arguments[3]===undefined?0:0,0,0);c.globalAlpha=1}
  function paintCell(c,px,py,color,size){c.fillStyle=color;c.fillRect(px*size+1,py*size+1,size-2,size-2);c.fillStyle='#ffffff25';c.fillRect(px*size+2,py*size+2,size-4,2);c.fillStyle='#00000028';c.fillRect(px*size+2,py*size+size-4,size-4,2)}
  function draw(){ctx.clearRect(0,0,boardCanvas.width,boardCanvas.height);ctx.fillStyle='#0b0e17';ctx.fillRect(0,0,boardCanvas.width,boardCanvas.height);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*SIZE+.5,0);ctx.lineTo(x*SIZE+.5,ROWS*SIZE);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE+.5);ctx.lineTo(COLS*SIZE,y*SIZE+.5);ctx.stroke()}grid?.forEach((row,y)=>row.forEach((v,x)=>{if(v)paintCell(ctx,x,y,COLORS[v],SIZE)}));if(piece){piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)paintCell(ctx,piece.x+x,piece.y+y,COLORS[piece.type],SIZE)}));let ghost={...piece,y:piece.y};while(!collides(ghost,0,1))ghost.y++;ghost.matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v)paintCell(ctx,ghost.x+x,ghost.y+y,COLORS[ghost.type]+'55',SIZE)}));piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)paintCell(ctx,piece.x+x,piece.y+y,COLORS[piece.type],SIZE)}))}}
  function drawNext(){nctx.clearRect(0,0,128,88);if(!next)return;const m=next.matrix,s=20,w=m[0].length*s,h=m.length*s,ox=(128-w)/2,oy=(88-h)/2;m.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.fillStyle=COLORS[next.type];nctx.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2);nctx.fillStyle='#ffffff25';nctx.fillRect(ox+x*s+2,oy+y*s+2,s-4,2)}}))}
  function loop(t){if(!running)return;const dt=t-last;last=t;if(!paused){dropCounter+=dt;if(dropCounter>Math.max(85,750-(level-1)*55)){if(!collides(piece,0,1))piece.y++;else lock();dropCounter=0}draw()}raf=requestAnimationFrame(loop)}
  function show(title,copy,button){document.querySelector('#overlay-title').textContent=title;document.querySelector('#overlay-copy').textContent=copy;document.querySelector('#start').textContent=button;overlay.classList.remove('hidden')}
  function endGame(){running=false;gameOver=true;show('GAME OVER','점수 '+fmt(score)+' · 다시 도전해보세요.','다시 시작')}
  function togglePause(){if(!running||gameOver)return;paused=!paused;if(paused)show('PAUSED','잠시 쉬어가도 괜찮아요.','계속하기');else overlay.classList.add('hidden')}
  const startButton=document.querySelector('#start');
  let lastPointerStart=0;
  function startOrResume(){if(paused&&!gameOver){paused=false;overlay.classList.add('hidden');last=performance.now()}else reset()}
  startButton.addEventListener('pointerup',e=>{e.preventDefault();lastPointerStart=Date.now();startOrResume()});
  startButton.addEventListener('click',e=>{if(Date.now()-lastPointerStart<500)return;e.preventDefault();startOrResume()});
  document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='Enter'&&(!running||gameOver)){reset();return}if(e.key.toLowerCase()==='p'){togglePause();return}if(e.key.toLowerCase()==='r'){reset();return}if(!running||paused)return;switch(e.key){case'ArrowLeft':move(-1);break;case'ArrowRight':move(1);break;case'ArrowDown':softDrop();break;case'ArrowUp':case'x':case'X':turn();break;case' ':hardDrop();break}});
  document.querySelectorAll('[data-action]').forEach(btn=>{const act=btn.dataset.action;const run=()=>{if(act==='left')move(-1);if(act==='right')move(1);if(act==='rotate')turn();if(act==='down')softDrop();if(act==='drop')hardDrop()};btn.addEventListener('pointerdown',e=>{e.preventDefault();run();if(act==='left'||act==='right'||act==='down'){btn._timer=setInterval(run,110)}});['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>clearInterval(btn._timer)))});
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));draw();drawNext();
})();
</script>
</body>
</html>
